<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Tags</title>
</head>
<body>
  <h1>Liste des tags</h1>
  <table border="1">
    <tr>
      <th>ID</th>
      <th>Libelle</th>
    </tr>
    <tr th:each="t : ${tags}">
      <td th:text="${t.id}"></td>
      <td th:text="${t.libelle}"></td>
    </tr>
  </table>
</body>
</html>
