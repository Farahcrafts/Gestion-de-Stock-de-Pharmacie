<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Fournisseurs</title>
</head>
<body>
  <h1>Liste des fournisseurs</h1>
  <table border="1">
    <tr>
      <th>ID</th>
      <th>Nom</th>
    </tr>
    <tr th:each="f : ${fournisseurs}">
      <td th:text="${f.id}"></td>
      <td th:text="${f.nom}"></td>
    </tr>
  </table>
</body>
</html>
